<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>تركيب العظام | معمل الحركة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fcfd;
            --card: #fff;
            --ink: #1f3d52;
            --ink2: #5a7587;
            --line: #d3e5ec;
            --teal: #17b8a6;
            --tint: #e5f6f3;
            --red: #e8584f;
            --blue: #3b9ad9;
            --sun: #ffc83d;
            --org: #ff8a3d;
            --bone: #f7eedb;
            --boneline: #c9b88f;
            --ok: #1a9a55;
            --grid: #e6f1f5;
            --h1: #d6f3ee;
            --h2: #fff1c6;
            --stage: #eaf6f9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top,0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #081426;
                --card: #0f2742;
                --ink: #e6eef7;
                --ink2: #9db4c8;
                --line: #244764;
                --teal: #2dd4bf;
                --tint: #12304a;
                --red: #ef6a5e;
                --blue: #6bb8dc;
                --bone: #e3d9c0;
                --boneline: #8a7c5a;
                --ok: #5fd18d;
                --grid: #0d2238;
                --h1: #0f2a3f;
                --h2: #143a66;
                --stage: #10304a
            }
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
            background-size: 28px 28px;
            color: var(--ink);
            font-family: Cairo,Tahoma,sans-serif;
            line-height: 1.9;
            font-size: 18px
        }

        .hero {
            background: linear-gradient(135deg,var(--h1),var(--h2));
            padding: 8px 14px;
            border-bottom: 4px solid var(--teal);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap
        }

            .hero h1 {
                font-size: 1.35rem;
                margin: 0;
                font-weight: 800
            }

        .tg {
            display: inline-block;
            background: var(--sun);
            color: #3a2a00;
            font-weight: 800;
            border-radius: 8px;
            padding: 0 12px;
            font-size: .9rem
        }

        .lesson {
            max-width: 1040px;
            margin: 0 auto;
            padding: 14px 14px 40px;
            display: grid;
            grid-template-columns: minmax(0,1.1fr) minmax(0,1fr);
            gap: 18px;
            align-items: start
        }

        .stagebox {
            position: sticky;
            top: 10px
        }

        .stage {
            position: relative;
            aspect-ratio: 1;
            border: 3px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            background: var(--stage)
        }

            .stage svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%
            }

        #scene {
            touch-action: pan-y
        }

        .drag #scene {
            touch-action: none;
            cursor: grab
        }

        #ov {
            pointer-events: none
        }

        .panel {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 20px;
            padding: 16px 18px
        }

            .panel h2 {
                font-size: 1.45rem;
                font-weight: 800;
                margin: 4px 0 6px;
                line-height: 1.5
            }

        .def {
            background: var(--tint);
            border-radius: 12px;
            padding: 8px 14px;
            margin: 10px 0;
            border-inline-start: 5px solid var(--teal);
            font-size: .98rem
        }

            .def b {
                color: var(--ink)
            }

        .demo {
            margin-top: 12px;
            border-top: 2px dashed var(--line);
            padding-top: 10px
        }

        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid var(--ink);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 5px 16px;
            cursor: pointer;
            margin: 4px 3px
        }

            button:hover {
                background: var(--tint)
            }

            button.on {
                background: var(--ink);
                color: var(--bg)
            }

            button:focus-visible, input:focus-visible, textarea:focus-visible {
                outline: 3px solid var(--sun);
                outline-offset: 2px
            }

        .opt {
            display: block;
            width: 100%;
            text-align: right;
            border-radius: 12px;
            margin: 5px 0
        }

        .good {
            background: var(--ok) !important;
            border-color: var(--ok) !important;
            color: #fff !important
        }

        .bad {
            background: var(--red) !important;
            border-color: var(--red) !important;
            color: #fff !important
        }

        .res {
            margin-top: 6px;
            font-size: .98rem
        }

            .res.ok {
                color: var(--ok);
                font-weight: 700
            }

            .res.no {
                color: var(--red);
                font-weight: 700
            }

            .res.md {
                background: var(--tint);
                border-radius: 10px;
                padding: 6px 12px
            }

        .in {
            font-family: inherit;
            font-size: 1rem;
            border: 2px solid var(--line);
            border-radius: 10px;
            padding: 0 10px;
            width: 8.5em;
            background: var(--bg);
            color: var(--ink);
            margin: 0 4px
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--teal)
        }

        .chip {
            display: inline-block;
            border-radius: 999px;
            padding: 0 12px;
            font-weight: 700;
            font-size: .92rem;
            margin: 2px
        }

            .chip.h {
                background: var(--teal);
                color: #042a26
            }

            .chip.w {
                background: var(--org);
                color: #3a1a00
            }

        .qq {
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 8px 12px;
            margin: 8px 0
        }

        .bo {
            stroke: var(--boneline);
            stroke-linecap: round
        }

        .bf {
            stroke: var(--bone);
            stroke-linecap: round
        }

        .bn {
            fill: var(--bone);
            stroke: var(--boneline);
            stroke-width: 1.6
        }

        .kpad, .kfr, .spad, .sfr {
            display: none
        }

        .kpad {
            fill: #7cc4e8;
            stroke: #3b9ad9;
            stroke-width: 1
        }

        .kfr {
            fill: none;
            stroke: var(--red);
            stroke-width: 2
        }

        .spad rect {
            fill: #7cc4e8
        }

        .sfr line {
            stroke: var(--red);
            stroke-width: 1.6;
            stroke-dasharray: 2 1.5
        }

        .kOn .kpad, .sOn .spad {
            display: inline
        }

        .kOff .kfr, .sOff .sfr {
            display: inline
        }

        .jm {
            fill: var(--sun);
            stroke: #fff;
            stroke-width: 2.5;
            cursor: pointer
        }

            .jm.h {
                fill: var(--teal)
            }

            .jm.w {
                fill: var(--org)
            }

            .jm.q {
                fill: var(--sun)
            }

        .org {
            transition: opacity .6s
        }

        #child, #skel, #ribs, #skull, #brain, #lungs {
            transition: opacity .8s
        }

        #fig {
            transition: transform .9s cubic-bezier(.4,1.6,.5,1);
            transform-origin: 200px 726px
        }

        @keyframes pl {
            50% {
                transform: scale(1.35);
                opacity: .4
            }
        }

        .pulse {
            animation: pl 1.2s infinite;
            transform-box: fill-box;
            transform-origin: center
        }

        .bub rect, .bub circle {
            fill: var(--card);
            stroke: var(--ink2);
            stroke-width: 3
        }

        .bub text {
            fill: var(--ink);
            font-family: Cairo,sans-serif
        }

        .b1 {
            font-size: 25px;
            font-weight: 800
        }

        .b2 {
            font-size: 21px
        }

        #ov .bub {
            transition: opacity .4s
        }

        .steps {
            position: relative;
            padding-inline-start: 32px
        }

            .steps::before {
                content: "";
                position: absolute;
                inset-inline-start: 11px;
                top: 30px;
                bottom: 30px;
                width: 4px;
                background: var(--line);
                border-radius: 2px
            }

        .step {
            position: relative;
            min-height: 74vh;
            display: flex;
            align-items: center;
            padding: 14px 0
        }

            .step .node {
                position: absolute;
                inset-inline-start: -32px;
                top: 50%;
                width: 26px;
                height: 26px;
                margin-top: -13px;
                border-radius: 50%;
                background: var(--card);
                border: 4px solid var(--line);
                transition: all .3s;
                z-index: 1
            }

            .step.dn .node {
                border-color: var(--teal)
            }

            .step.on .node {
                background: var(--teal);
                border-color: var(--teal);
                transform: scale(1.25)
            }

            .step .panel {
                width: 100%;
                opacity: .5;
                transition: opacity .4s,box-shadow .4s,border-color .4s
            }

            .step.on .panel {
                opacity: 1;
                border-color: var(--teal);
                box-shadow: 0 8px 0 -3px color-mix(in srgb,var(--teal) 35%,transparent)
            }

        .sn {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 14px;
            border-top: 2px dashed var(--line);
            padding-top: 10px
        }

            .sn button {
                background: var(--teal);
                border-color: var(--teal);
                color: #042a26;
                font-weight: 800;
                padding: 4px 22px
            }

                .sn button.g {
                    background: var(--card);
                    color: var(--ink);
                    border-color: var(--ink)
                }

        #prog {
            position: fixed;
            top: 0;
            inset-inline: 0;
            height: 5px;
            z-index: 40
        }

            #prog i {
                display: block;
                height: 100%;
                width: 0;
                background: var(--teal);
                border-radius: 0 3px 3px 0;
                transition: width .15s
            }

        @media(max-width:780px) {
            .lesson {
                grid-template-columns: 1fr;
                padding-top: 6px
            }

            .stagebox {
                top: 0;
                margin: 0 -14px;
                padding: 8px 14px 10px;
                z-index: 20;
                background-color: var(--bg);
                background-image: linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
                background-size: 28px 28px;
                border-bottom: 4px solid var(--teal);
                box-shadow: 0 10px 16px -8px rgba(31,61,82,.35)
            }

            .stage {
                width: min(100%,42vh);
                margin: 0 auto
            }

            .step {
                min-height: 50vh
            }

            .steps {
                padding-inline-start: 28px
            }

            .step .node {
                inset-inline-start: -28px;
                width: 22px;
                height: 22px;
                margin-top: -11px
            }

            body {
                font-size: 17px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>
<body>
    <div id="prog"><i></i></div>
    <header class="hero"><span class="tg">معمل الحركة | الدرس الثاني</span><h1>تركيب العظام</h1></header>
    <main class="lesson"><div class="stagebox"><div class="stage"><svg id="scene" viewBox="0 0 760 760" role="img" aria-label="الجسم والهيكل العظمي"></svg><svg id="ov" viewBox="0 0 760 760" aria-hidden="true"></svg></div></div><div class="steps" id="steps"></div></main>
    <script>
    /* ===== drawing builders ===== */
        function ln(x1, y1, x2, y2, w) { var a = ' x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"'; return '<line class="bo"' + a + ' stroke-width="' + (w + 3) + '"/><line class="bf"' + a + ' stroke-width="' + w + '"/>' }
        function pth(d, w) { return '<path class="bo" fill="none" d="' + d + '" stroke-width="' + (w + 3) + '"/><path class="bf" fill="none" d="' + d + '" stroke-width="' + w + '"/>' }
        function mir(h) { return '<g transform="translate(400,0) scale(-1,1)">' + h + '</g>' }
        function chain(x, y, L) { var o = '', c = '', yy = y; L.forEach(function (l, i) { o += '<g class="fj" data-k="' + i + '" data-x="' + x + '" data-y="' + yy + '">' + ln(x, yy, x, yy + l, 3.4) + '<circle class="bn" cx="' + x + '" cy="' + yy + '" r="2"/>'; c += '</g>'; yy += l }); return o + c }
        function ARM(s) {
            var f = [[91.5, [14, 10, 8]], [97.5, [16, 11, 8]], [103.5, [15, 10, 8]], [109.5, [12, 9, 7]]].map(function (q) { return chain(q[0], 382, q[1]) }).join('') + chain(85, 362, [13, 10]);
            return '<g id="arm' + s + '" data-n="عظمة العضد"><circle class="bn" cx="114" cy="155" r="9"/>' + ln(113, 160, 106, 246, 9) + '<circle class="bn" cx="105" cy="252" r="8"/>' +
                '<g id="fore' + s + '" data-n="عظمتا الساعد">' + ln(109, 258, 104, 344, 5) + ln(100, 258, 95, 344, 5) + '<circle class="bn" cx="99" cy="350" r="6"/>' +
                '<g id="hand' + s + '" data-n="عظام اليد"><path class="bn" d="M88 354 L112 354 L113 382 L87 382Z"/>' + f + '</g></g></g>'
        }
        function LEG(s) {
            var mt = '', tz = '';[156, 162, 168, 174, 180].forEach(function (x) { mt += ln(x, 686, x, 704, 3.2); tz += ln(x, 704, x, 713, 3.2) });
            var low = '<g id="low' + s + '" data-n="عظمة الساق"><path class="bn" d="M146 537 L186 537 L178 549 L174 652 L168 662 L164 662 L158 652 L154 549Z"/><path class="bn" d="M141 543 L148 543 L149 654 L145 658Z"/><g id="foot' + s + '" data-n="عظام القدم"><path class="bn" d="M158 668 L178 668 L184 700 L152 700Z"/>' + mt + tz + '</g></g>';
            return '<g id="leg' + s + '" data-n="عظمة الفخذ">' + low + '<circle class="bn" cx="168" cy="388" r="10"/>' +
                '<path class="bn" d="M160 394 L176 394 L174 500 C186 508 190 526 176 531 L156 531 C142 526 146 508 158 500Z"/><circle class="bn" data-n="الرضفة (عظمة الركبة)" cx="166" cy="514" r="8"/>' +
                '<ellipse class="kpad" cx="166" cy="533.5" rx="24" ry="4.6"/><path class="kfr" d="M146 533 l4 -3 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6 l4 6"/></g>'
        }
        var JS_ = [['shoulder', 'الكتف', 114, 155, 'w'], ['elbow', 'الكوع', 105, 252, 'h'], ['wrist', 'الرسغ', 99, 352, 'w'], ['fingers', 'أصابع اليد', 97, 398, 'h'], ['hip', 'الفخذ', 168, 388, 'w'], ['knee', 'الركبة', 166, 534, 'h'], ['ankle', 'الكاحل', 168, 664, 'w'], ['toes', 'أصابع القدم', 168, 708, 'h']];
        function build() {
            var v = '', dc = '', fr = '';
            for (var i = 0; i < 22; i++) { var y = 124 + i * 8.8, w = i < 5 ? 14 : i < 17 ? 18 : 24; v += '<rect class="bn" x="' + (200 - w / 2) + '" y="' + y + '" width="' + w + '" height="6" rx="2"/>'; dc += '<rect x="' + (201 - w / 2) + '" y="' + (y + 6) + '" width="' + (w - 2) + '" height="2.8" rx="1.2"/>'; fr += '<line x1="' + (197 - w / 2) + '" y1="' + (y + 7.4) + '" x2="' + (203 + w / 2) + '" y2="' + (y + 7.4) + '"/>' }
            var rb = ''; for (var i = 0; i < 7; i++) { var y = 158 + i * 16.5, w = 40 + 26 * Math.sin((i + .5) / 7 * Math.PI), d = 'M197 ' + y + ' C' + (200 - w - 12) + ' ' + (y - 6) + ' ' + (200 - w - 10) + ' ' + (y + 20) + ' 197 ' + (y + 27); rb += pth(d, 4.5) + mir(pth(d, 4.5)) }
            var jm = ''; JS_.forEach(function (j) { [j[2], 400 - j[2]].forEach(function (x) { jm += '<circle class="jm q" data-t="' + j[4] + '" data-j="' + j[0] + '" cx="' + x + '" cy="' + j[3] + '" r="9"/>' }) });
            var st = pth('M198 144 Q160 134 118 148', 5) + '<path class="bn" d="M134 150 L120 152 L126 204 L150 190Z"/>';
            var skull = '<g id="skull" data-n="الجمجمة"><ellipse class="bn" cx="200" cy="64" rx="38" ry="36"/><path class="bn" d="M168 78 C168 104 176 112 186 114 L214 114 C224 112 232 104 232 78Z"/><path class="bn" d="M176 110 L224 110 L220 128 Q200 140 180 128Z"/><path d="M182 118 H218 M190 114 V122 M200 114 V122 M210 114 V122" stroke="#9a8a63" stroke-width="1.2" fill="none"/><ellipse cx="186" cy="76" rx="8" ry="9" fill="#33505f"/><ellipse cx="214" cy="76" rx="8" ry="9" fill="#33505f"/><path d="M200 88 L195 100 L205 100Z" fill="#33505f"/></g>';
            var pelvis = '<g data-n="عظام الحوض"><path class="bn" d="M200 318 C176 306 132 308 126 340 C122 366 138 392 166 398 C180 400 192 392 200 384 C208 392 220 400 234 398 C262 392 278 366 274 340 C268 308 224 306 200 318Z"/><path class="bn" d="M184 322 L216 322 L206 372 L194 372Z"/><ellipse cx="160" cy="384" rx="6" ry="9" fill="none" stroke="#c9b88f" stroke-width="2"/><ellipse cx="240" cy="384" rx="6" ry="9" fill="none" stroke="#c9b88f" stroke-width="2"/><circle cx="168" cy="388" r="13" fill="none" stroke="#c9b88f" stroke-width="2.5"/><circle cx="232" cy="388" r="13" fill="none" stroke="#c9b88f" stroke-width="2.5"/></g>';
            var skel = '<g id="skel" clip-path="url(#sc)">' + '<g data-n="العمود الفقري">' + v + '<g class="spad">' + dc + '</g><g class="sfr">' + fr + '</g></g>' + skull + pelvis + '<g data-n="عظمة الترقوة والكتف">' + st + mir(st) + '</g>' +
                '<g id="ribs" data-n="القفص الصدري (الضلوع)">' + rb + '<rect class="bn" x="195" y="152" width="10" height="78" rx="4"/><path class="bn" d="M198 228 L202 228 L200 244Z"/></g>' +
                ARM('L') + mir(ARM('R')) + LEG('L') + mir(LEG('R')) + '</g>';
            var lung = '<path d="M192 166 C168 160 142 190 146 242 C148 266 182 268 192 254Z" fill="#a7d9ef" stroke="#5aa3c8" stroke-width="2"/>';
            var orgs = '<g id="brain" class="org"><path d="M200 36 C226 32 240 50 236 68 C232 82 214 88 200 84 C186 88 168 82 164 68 C160 50 174 32 200 36Z" fill="#f2a1b5" stroke="#c9667f" stroke-width="2"/><path d="M200 38 V82 M182 50 Q190 58 182 68 M218 50 Q210 58 218 68" fill="none" stroke="#c9667f" stroke-width="1.8"/></g><g id="lungs" class="org">' + lung + mir(lung) + '<path d="M214 214 C202 196 176 212 214 250 C250 212 226 196 214 214Z" fill="#e8584f" stroke="#a82d26" stroke-width="2"/></g>';
            var ch = build_child();
            return { fig: '<g id="fig">' + ch + orgs + skel + '<g id="jm">' + jm + '</g><g id="rings"></g><g id="ind"></g></g>' };
        }
        function build_child() {
            function lg() { return '<path d="M166 340 L165 520" stroke="#2d527e" stroke-width="78" stroke-linecap="round"/><path d="M165 520 L168 672" stroke="#2d527e" stroke-width="64" stroke-linecap="round"/><path d="M166 340 L165 520" stroke="#3e6fa8" stroke-width="74" stroke-linecap="round"/><path d="M165 520 L168 672" stroke="#3e6fa8" stroke-width="60" stroke-linecap="round"/><path d="M146 680 L190 680 L198 708 Q202 724 184 726 L142 726 Q136 712 146 680Z" fill="#fff" stroke="#9fb4c8" stroke-width="2"/><path d="M144 718 L196 718 L196 726 L144 726Z" fill="#17b8a6"/><path d="M160 688 L178 692 M158 696 L180 700" stroke="#17b8a6" stroke-width="2.5"/>' }
            function ar() { return '<path d="M106 226 L99 350" stroke="#e0b48c" stroke-width="28" stroke-linecap="round"/><circle cx="97" cy="374" r="15" fill="#f4cfae"/><path d="M106 228 L99 350" stroke="#f4cfae" stroke-width="24" stroke-linecap="round"/>' }
            function sl() { return '<path d="M116 146 L106 234" stroke="#c9423a" stroke-width="42" stroke-linecap="round"/><path d="M116 146 L106 234" stroke="#ff7a6b" stroke-width="38" stroke-linecap="round"/>' }
            return '<g id="child">' + lg() + mir(lg()) + ar() + mir(ar()) +
                '<path d="M114 128 C150 112 250 112 286 128 L298 176 L270 338 L130 338 L102 176Z" fill="#ff7a6b" stroke="#c9423a" stroke-width="3"/>' + sl() + mir(sl()) +
                '<path d="M130 330 H270 V346 H130Z" fill="#5a3d2b"/><rect x="190" y="330" width="20" height="16" rx="3" fill="#ffc83d"/>' +
                '<path d="M200 214 l7 15 17 2 -12 11 4 17 -16 -9 -16 9 4 -17 -12 -11 17 -2z" fill="#fff"/><path d="M170 120 Q200 138 230 120" fill="none" stroke="#c9423a" stroke-width="4"/>' +
